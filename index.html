<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swod's Live Streams Showcase! 🎀</title>
    <style>
        /* General Body and Cute Blue Theme */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f8ff; /* Light, cute baby blue background */
            color: #1e90ff; /* Dodger Blue for main text */
            text-align: center;
            padding: 20px;
            margin: 0;
        }

        /* Header Styling */
        h1 {
            color: #4169e1; /* Royal Blue for a nice pop */
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px #add8e6; /* Light blue shadow for cuteness */
        }

        /* Container for the Streams */
        .stream-container {
            display: flex;
            flex-wrap: wrap; 
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
        }

        /* Individual Stream Box Styling */
        .stream-box {
            background-color: #ffffff; 
            border: 5px solid #87ceeb; /* Sky Blue border */
            border-radius: 15px; 
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1); 
            padding: 15px;
            width: 90%; 
            max-width: 500px; 
            transition: transform 0.3s ease;
        }

        .stream-box:hover {
            transform: translateY(-5px); /* Cute little lift on hover */
        }

        /* Stream Title */
        h2 {
            color: #00bfff; /* Deep Sky Blue */
            margin-top: 0;
            margin-bottom: 10px;
        }

        /* Iframe Styling */
        iframe {
            width: 100%;
            height: 300px; 
            border: none;
            border-radius: 10px;
        }

        /* Responsive adjustments for smaller screens */
        @media (min-width: 1024px) {
            .stream-container {
                gap: 50px;
            }
            .stream-box {
                width: 45%; 
            }
        }
    </style>
</head>
<body>

    <h1>Swod's Live Streams! ✨</h1>
    <p>Check out which channel is live right now! *Ganbatte!*</p>

    <div class="stream-container">

        <div class="stream-box">
            <h2>🟣 Kick Channel</h2>
            <iframe
                src="https://player.kick.com/swod"
                frameborder="0"
                allowfullscreen="true"
                allow="autoplay; encrypted-media; picture-in-picture">
            </iframe>
            <p>Click the stream to watch! </p>
        </div>

        <div class="stream-box">
            <h2>💜 Twitch Channel</h2>
            <iframe
                src="https://player.twitch.tv/?channel=s3od9991&parent=s99d.github.io&muted=false"
                frameborder="0"
                allowfullscreen="true"
                allow="autoplay; encrypted-media; picture-in-picture">
            </iframe>
            <p>Don't forget to follow! </p>
        </div>

    </div>

</body>
</html>
